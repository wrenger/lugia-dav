[package]
name = "lugia-dav"
version = "0.1.0"
edition = "2024"
default-run = "lugia-dav"
rust-version = "1.95.0"

[profile.release]
lto = "thin"
strip = true

[dependencies]
hex = "0.4"
httpdate = "1.0"
base64 = "0.23"
sha2 = "0.11"
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
facet = "0.46"
facet-xml = "0.46"
env_logger = { version = "0.11", default-features = false, features = [
    "humantime",
    "auto-color",
] }
log = "0.4"
mime_guess = "2.0"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
chrono = "0.4"
maud = "0.27"
rand = { version = "0.10", optional = true }
winnow = "1.0.5"

[dev-dependencies]
rediff = "0.46"

[[bin]]
name = "login"
path = "src/bin/login.rs"
required-features = ["rand"]
